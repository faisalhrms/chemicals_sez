default: &default
  adapter: postgresql
  encoding: unicode
  host: <%= ENV.fetch("DB_HOST", "127.0.0.1") %>
  port: <%= ENV.fetch("DB_PORT", 5432) %>
  username: <%= ENV.fetch("DB_USER", "db_user") %>
  password: <%= ENV.fetch("DB_PASSWORD", "") %>
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>

development:
  <<: *default
  database: sapphire_sez_portal_development

test:
  <<: *default
  database: sapphire_sez_portal_test

production:
  <<: *default
  database: <%= ENV.fetch("DB_NAME", "sapphire_sez_portal_production") %>
